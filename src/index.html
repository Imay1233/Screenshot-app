<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f0f0f0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    #screenshot-container {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .screenshot-wrapper {
      position: relative;
      display: inline-block;
    }

    .screenshot {
      max-width: 200px;
      max-height: 200px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: white;
      color: black;
      border: 1px solid #ccc;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      line-height: 22px;
      text-align: center;
      display: none;
    }

    .screenshot-wrapper:hover .delete-btn {
      display: block;
    }

    .placeholder-text {
      color: #888;
      font-style: italic;
    }

    .hidden {
      display: none;
    }

    .selection-method, .capture-mode, .image-format {
      margin: 10px 0;
      text-align: center;
    }

    .selection-method label, .capture-mode label, .image-format label {
      margin: 0 10px;
      font-size: 14px;
    }

    .selection-method input[type="radio"], .capture-mode input[type="radio"] {
      margin-right: 5px;
    }

    .image-format select {
      padding: 5px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Screenshot App</h1>
    <button id="capture-btn">Take Screenshot</button>
    
    <!-- Selection method toggle section -->
    <div class="selection-method">
      <h3>Selection method</h3>
      <label>
        <input type="radio" name="selection-mode" value="drag" checked> Drag mode
      </label>
      <label>
        <input type="radio" name="selection-mode" value="click"> Click mode
      </label>
    </div>
    
    <!-- Capture mode toggle section -->
    <div class="capture-mode">
      <h3>Capture mode</h3>
      <label>
        <input type="radio" name="capture-mode" value="instant" checked> Instant mode
      </label>
      <label>
        <input type="radio" name="capture-mode" value="resize"> Resize mode
      </label>
    </div>
    
    <!-- Image format selection -->
    <div class="image-format">
      <h3>Image format</h3>
      <select id="image-format">
        <option value="png" selected>PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
      </select>
    </div>
    
    <button id="save-btn" disabled>Save Recent Screenshot</button>
    <div id="screenshot-container"></div>
    <p class="placeholder-text">No screenshots yet. Click "Take Screenshot" to capture one.</p>
  </div>
  <script src="renderer.js"></script>

</html>
